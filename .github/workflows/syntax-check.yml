name: Syntax checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.3"

      - name: Parse R scripts
        shell: Rscript {0}
        run: |
          files <- c("setup.R", "run_pipeline.R", list.files("scripts", "[.]R$", full.names = TRUE))
          invisible(lapply(files, parse))

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python scripts
        run: python -m py_compile scripts/07_aop_network.py
